ShortDescription: Speak into your microphone and have a synthetic voice repeat it into a virtual microphone.
Description: |-
  Voice2TTS listens to your microphone, transcribes what you say with Whisper, and
  speaks it back in a Piper voice through a virtual microphone that Discord, Zoom,
  OBS and other applications can use as an input device.

  Everything runs locally; no audio leaves the machine. Push-to-talk and automatic
  speech detection are both supported, speech can be sent to several devices at
  once, and a pronunciation dictionary fixes names the recogniser mishears.

  A virtual audio device such as VB-CABLE is required for other applications to
  hear the output; the setup wizard can install one.
