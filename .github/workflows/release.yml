name: Release

# Publishing is driven entirely by the tag. scripts/release.ps1 can still do it
# locally, but this way a release never depends on one particular machine.
#
# The verify job is NOT optional. ci.yml deliberately ignores tags, so without it
# a tag push would publish without a single check having run -- which is exactly
# what happened to v0.5.0: CI failed on the commit and the release shipped anyway.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.5.1)"
        required: true

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # Everything that can reject a release runs here, before anything is built.
  # Ordered cheapest-first so a mistake surfaces in seconds, not after a model
  # download and a PyInstaller run.
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")

          # Parsed with PowerShell rather than an inline python -c: nesting quotes
          # inside a double-quoted PowerShell string needs backtick escapes, not
          # backslashes, and getting that wrong is a parse error at job start.
          $found = Select-String -Path voice2tts/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          if (-not $found) { throw "Could not find __version__ in voice2tts/__init__.py" }
          $declared = $found.Matches[0].Groups[1].Value

          # The updater compares the tag against __version__. If they disagree, the
          # published build would not recognise itself as the release, so stop here
          # rather than ship something that can never be updated from.
          if ($version -ne $declared) {
            throw "Tag $tag says $version but voice2tts/__init__.py says $declared. Bump the version and re-tag."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing $tag (version $version)"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check --output-format github .

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch models
        run: python scripts/fetch_models.py --bundle

      # Runners have no audio hardware, so device-dependent checks are skipped.
      - name: Self-test
        run: python scripts/selftest.py --no-audio

      # ci.yml ignores tags, so this is the ONLY place the GUI tests run before
      # a release. Without it a broken settings window ships -- which is how
      # 0.5.1 went out with every dropdown dead.
      - name: GUI test
        run: python scripts/guitest.py

  release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build.ps1 -Python "$env:pythonLocation\python.exe" -Version "${{ needs.verify.outputs.version }}"

      - name: Verify artifacts
        shell: pwsh
        run: |
          $setup = "dist\installer\Voice2TTS-Setup-${{ needs.verify.outputs.version }}.exe"
          if (-not (Test-Path $setup))        { throw "Missing $setup" }
          if (-not (Test-Path "$setup.sha256")) { throw "Missing $setup.sha256" }
          # Re-verify the checksum here: the updater refuses a mismatch, so a wrong
          # .sha256 asset would make the release un-installable for everyone.
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $recorded = (Get-Content "$setup.sha256" -Raw).Split()[0].ToLower()
          if ($actual -ne $recorded) { throw "Checksum mismatch: $actual vs $recorded" }
          "{0:N0} MB, sha256 {1}" -f ((Get-Item $setup).Length / 1MB), $actual

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $tag = "${{ needs.verify.outputs.tag }}"
          $setup = "dist\installer\Voice2TTS-Setup-$version.exe"

          $notesFile = "release-notes.md"
          # Prefer the hand-written changelog section for this version; fall back to
          # generated notes only if there isn't one.
          #
          # Built by concatenating SINGLE-quoted parts. In a double-quoted PowerShell
          # string "$(" opens a subexpression, so a lookahead like "$(?=...)" is a
          # parse error rather than a regex.
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\].*?(?=^## \[|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success) {
            $match.Value.Trim() | Out-File $notesFile -Encoding utf8
            $notesArg = @("--notes-file", $notesFile)
            Write-Host "Using CHANGELOG section for $version"
          } else {
            $notesArg = @("--generate-notes")
            Write-Host "No CHANGELOG section for $version; generating notes"
          }

          # GitHub Actions runs pwsh with $ErrorActionPreference = 'stop'. Redirecting
          # a native command's stderr under that setting can turn an expected failure
          # (release does not exist yet) into a fatal error, so probe deliberately.
          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prev

          if ($exists) {
            Write-Host "Release $tag already exists; replacing its assets"
            gh release upload $tag $setup "$setup.sha256" --clobber
          } else {
            $ghArgs = @("release", "create", $tag, $setup, "$setup.sha256",
                        "--title", "Voice2TTS $version") + $notesArg
            gh @ghArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit $LASTEXITCODE" }
          Write-Host "Published $tag"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/**/warn-*.txt
            dist/installer/*
          if-no-files-found: ignore
