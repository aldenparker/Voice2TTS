name: CI

on:
  push:
    branches: ["**"]
    # Tags are skipped here because release.yml runs its own verify job with the
    # same lint and self-test before it builds anything. That was previously only
    # a comment and not true, which let a tag publish over a failing test.
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check --output-format github .

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Models are gitignored (~380 MB) and slow to fetch, so cache them across runs.
      - name: Cache models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch models
        if: steps.models.outputs.cache-hit != 'true'
        run: python scripts/fetch_models.py --bundle

      # Runners have no audio hardware, so device-dependent checks are skipped.
      # The speech sample is synthesized on demand rather than read from spike/out,
      # which is gitignored and therefore absent on a clean checkout.
      - name: Self-test
        run: python scripts/selftest.py --no-audio

      # This one is advisory; release.yml runs the same suite as a hard gate.
      - name: GUI smoke test
        run: python scripts/guitest.py
        continue-on-error: true

      # The same tests with every optional download absent and a small screen.
      # A runner is already all of those things, so this mostly earns its keep
      # on a developer machine -- where voices, models and both packs ARE
      # installed, and a test that quietly depends on them looks green until it
      # reaches CI.
      - name: Interface tests on a fresh machine
        run: python scripts/fresh_machine.py
        continue-on-error: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ~/AppData/Roaming/Voice2TTS/*.log
          if-no-files-found: ignore

  # Packaging breaks in ways nothing else catches -- a frozen build that will not
  # start looks perfectly healthy from a source checkout.
  package:
    needs: [lint, test]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch models
        run: python scripts/fetch_models.py --bundle

      # -SkipInstaller: Inno Setup is not needed to prove the spec is intact and the
      # frozen build starts and resolves its bundled models, which is where
      # packaging actually goes wrong. The installer itself is built by release.yml.
      - name: Build frozen app
        shell: pwsh
        run: .\build.ps1 -SkipInstaller -Python "$env:pythonLocation\python.exe"

      - name: Upload PyInstaller warnings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-warnings
          path: build/**/warn-*.txt
          if-no-files-found: ignore
