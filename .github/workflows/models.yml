name: Translation models

# Converts Helsinki-NLP's OPUS-MT weights to CTranslate2 and attaches them to a
# release of their own. Deliberately separate from release.yml: models change on
# a different schedule than the app (a new language pair does not need a new
# build), they take far longer to produce, and a failure converting Japanese
# should not be able to hold up an application release.
#
# The tag the app reads is pinned in voice2tts/translate.py (MODELS_TAG), so
# publishing a newer set does not change what an already-shipped build
# downloads. Bump both together when the format changes.
#
# Two ways to start it, and never on an ordinary push -- 800 MB of model
# conversion is not a per-commit job:
#
#   git tag models-2 && git push origin models-2     <- same as an app release
#   or the "Translation models" action, run by hand
#
# The tag trigger exists because the Actions tab is easy to miss: the first
# build shipped with a download button and nothing behind it, because the
# workflow had simply never been run.
on:
  push:
    tags: ["models-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the models under"
        required: true
        default: "models-2"
      pairs:
        description: >-
          Pairs to convert, e.g. "en de fr". Blank converts every pair in
          scripts/convert_mt.py.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  convert:
    # Ubuntu, not Windows: this job only rewrites weights, and the runner is
    # faster and has more disk. Nothing produced here is platform-specific.
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # torch and transformers are build-time only -- they read the original
      # weights so ct2 can rewrite them, and never reach a user's machine.
      # The CPU wheel is a tenth the size of the CUDA one and conversion does
      # not touch a GPU.
      - name: Install the conversion tools
        run: |
          python -m pip install --upgrade pip
          pip install ctranslate2==4.6.0 transformers==4.57.1 \
                      huggingface_hub sentencepiece \
                      --extra-index-url https://download.pytorch.org/whl/cpu torch

      - name: Convert
        id: convert
        # Inputs go through the environment, never straight into the script.
        # A `run:` block is textually substituted before the shell sees it, so
        # an input inlined there is executed, not quoted.
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          if [ -n "$PAIRS" ]; then
            # A space-separated list of language codes, converted in both
            # directions -- "en de fr" means en<->de and en<->fr, because a
            # one-way pair is rarely what anyone wants.
            set -- $PAIRS
            for target in "$@"; do
              [ "$target" = "en" ] && continue
              python scripts/convert_mt.py en "$target" || true
              python scripts/convert_mt.py "$target" en || true
            done
            python -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); \
                       from convert_mt import write_manifest; write_manifest(Path('dist/mt'))"
          else
            python scripts/convert_mt.py --all
          fi

      # A manifest listing pairs whose archives failed to upload would send
      # every user to a 404. Checked here rather than trusted.
      - name: Check the manifest against what was produced
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          out = Path("dist/mt")
          manifest = json.loads((out / "manifest.json").read_text())
          missing = [p["asset"] for p in manifest["pairs"]
                     if not (out / p["asset"]).is_file()]
          if missing:
              sys.exit(f"manifest lists assets that were not produced: {missing}")
          if not manifest["pairs"]:
              sys.exit("no pairs converted; refusing to publish an empty catalogue")
          for pair in manifest["pairs"]:
              if not pair["sha256"]:
                  sys.exit(f"{pair['asset']} has no checksum")
              if not pair["licence"]:
                  sys.exit(f"{pair['asset']} has no licence recorded")
          total = sum(p["bytes"] for p in manifest["pairs"])
          print(f"{len(manifest['pairs'])} pair(s), {total / 1e6:.0f} MB")
          EOF

      # Assets first, verdict second. A pair that upstream does not publish
      # (en-ja is not a repository, though ja-en is) must not throw away the
      # fifteen that converted -- which is exactly what happened on the first
      # real run.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push carries no inputs; the tag name is the tag.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          OPUS-MT models converted to CTranslate2 (int8).

          Original weights by the Helsinki-NLP group, used under CC-BY-4.0.
          Each archive carries a LICENSE file with the full attribution.

          These are downloaded by the app from the Translate tab; there is
          nothing to install by hand.
          NOTES

          # The manifest goes up LAST. Until it lands the release is invisible
          # to the app, so a run that dies part way through leaves the previous
          # catalogue intact rather than a half-published one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Also on the update path, so re-running fixes a release that was
            # published before this flag existed. models-2 went out as a normal
            # release and GitHub duly called it the latest one.
            gh release edit "$TAG" --prerelease
            gh release upload "$TAG" dist/mt/*.zip dist/mt/*.zip.sha256 --clobber
          else
            # --prerelease so GitHub never calls this the "latest release".
            # That endpoint means "newest thing that is not a draft or a
            # pre-release", and when the models release took that spot, every
            # user on the stable channel was told they were up to date forever.
            # The app filters non-app releases out too; this keeps the
            # repository page honest as well.
            gh release create "$TAG" dist/mt/*.zip dist/mt/*.zip.sha256 \
              --title "Translation models" --notes-file notes.md --prerelease
          fi
          gh release upload "$TAG" dist/mt/manifest.json --clobber

      # After the assets are safely uploaded.
      - name: Report any pair that could not be converted
        if: always()
        run: |
          if [ -f dist/mt/FAILURES ]; then
            {
              echo "### Pairs that could not be converted"
              sed 's/^/- /' dist/mt/FAILURES
              echo ""
              echo "Usually a model upstream does not publish under the name"
              echo "the template expects. Add it to REPO_OVERRIDES in"
              echo "scripts/convert_mt.py."
            } >> $GITHUB_STEP_SUMMARY
            echo "FAILED:"
            cat dist/mt/FAILURES
            exit 1
          fi
          echo "every pair converted"

      - name: Summary
        run: |
          echo "### Translation models" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/mt/manifest.json").read_text())
          print("| Direction | Size | Licence |")
          print("|---|---|---|")
          for pair in manifest["pairs"]:
              print(f"| {pair['source']} → {pair['target']} "
                    f"| {pair['bytes'] / 1e6:.0f} MB | {pair['licence']} |")
          EOF
