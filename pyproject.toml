[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice2tts"
description = "Speak, get recognized, get re-spoken through a virtual microphone"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt", "COPYING"]
dynamic = ["version"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper==1.2.1",
    "piper-tts==1.7.0",
    "onnxruntime==1.28.0",
    "sounddevice==0.5.5",
    "soxr==1.1.0",
    "numpy>=2.0",
    "pystray==0.19.5",
    "pillow>=10",
    "pynput==1.8.2",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# GPU support is downloaded at runtime by voice2tts/gpupack.py rather than
# installed here, so a CPU-only machine never pays the 1.3 GB. Listed for
# developers who want it in the venv up front.
cuda = [
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pyinstaller>=6.10",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
voice2tts = "voice2tts.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "voice2tts.__version__" }

[tool.setuptools.packages.find]
include = ["voice2tts*"]

[tool.ruff]
line-length = 92
target-version = "py311"
exclude = ["build", "dist", "spike"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "BLE",       # blind except
    "RUF",
]
# BLE001 is deliberately enabled rather than ignored: broad excepts ARE used
# throughout, because an audio callback or worker thread that raises kills a feature
# silently. Each one is marked with an explicit noqa and a reason, so the rule
# stays on and new unexplained ones still get caught.
ignore = [
    "E501",   # long lines are capped by line-length; prose comments may exceed
    "SIM105", # contextlib.suppress is slower on hot paths and no clearer here
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]      # scripts print by design
"Voice2TTS.spec" = ["F821"] # PyInstaller injects SPECPATH, Analysis, EXE, COLLECT

[tool.mypy]
python_version = "3.12"
files = ["voice2tts"]
# Third-party audio and ML packages ship no stubs. Their absence says nothing
# about our code, and drowning the real output in it is how a checker gets
# turned off two weeks after it is added.
ignore_missing_imports = true
# The interface tier. Tk is dynamic by nature and its widgets carry no useful
# types, so this catches only what needs no annotations: calling something that
# does not exist, unpacking the wrong shape, returning nothing from a function
# whose result is used.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The core tier: where the modes and the state machine live, and where every
# bug this sweep was called for actually happened. Annotations are required
# here, so adding a member to a StrEnum turns every `match` that does not
# handle it into a build failure rather than a wrong answer at runtime.
#
# Not `strict = true`: that also forbids calling into the untyped interface
# modules, which would be a hundred findings about Tk and none about us.
[[tool.mypy.overrides]]
module = [
    "voice2tts.config",
    "voice2tts.gpupack",
    "voice2tts.jppack",
    "voice2tts.modes",
    "voice2tts.net",
    "voice2tts.pipeline",
    "voice2tts.plan",
    "voice2tts.profiles",
    "voice2tts.stt",
    "voice2tts.streaming",
    "voice2tts.translate",
    "voice2tts.tts",
    "voice2tts.updater",
    "voice2tts.vad",
    "voice2tts.voices",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
